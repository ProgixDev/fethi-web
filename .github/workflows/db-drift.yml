name: db-drift

# Guards the enforceable cross-repo type contract (docs/db/COORDINATION.md §5).
# Regenerates src/lib/database.types.ts from the remote schema and fails if it
# differs from what's committed — i.e. someone changed the DB without committing
# the regenerated types (or hand-edited the generated file).
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/lib/database.types.ts'
      - 'scripts/db-types.mjs'
      - 'package.json'
      - '.github/workflows/db-drift.yml'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fail fast if required secrets are missing
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_PROJECT_ID and SUPABASE_ACCESS_TOKEN repo secrets are required for the db-drift guard."
            exit 1
          fi

      - name: Regenerate types
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run db:types

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- src/lib/database.types.ts; then
            echo "::error::database.types.ts is out of date. Run 'npm run db:types', commit the result, and re-vendor it to fethi-mobile (see docs/db/COORDINATION.md §5)."
            exit 1
          fi
